<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sistem Informasi Akademik SMK BATIK 1 SURAKARTA — informasi siswa, jadwal, nilai, presensi, dan pengumuman.">
<link rel="icon" href="/assets/favicon.ico">
<meta name="theme-color" content="#0d6efd">

<title>SISFO SMK BATIK 1 SURAKARTA</title>

<style>
:root{
  --primary: #0d6efd;
  --primary-dark: #084298;
  --success: #198754;
  --bg: #f4f6f9;
  --card-bg: #ffffff;
  --text: #0b1220;
  --radius: 10px;
  --gap: 20px;
  --max-width: 1100px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
}
header{
    background:var(--primary);
    color:white;
    padding:20px;
    text-align:center;
}
nav{
    background:var(--primary-dark);
    display:flex;
    justify-content:center;
    gap:15px;
    padding:10px;
    flex-wrap:wrap;
}
nav a{
    color:white;
    text-decoration:none;
    font-weight:700;
}
.container{
    width:90%;
    max-width:var(--max-width);
    margin:20px auto;
}
.card{
    background:var(--card-bg);
    padding:20px;
    border-radius:var(--radius);
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    margin-bottom:20px;
}
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:var(--gap);
}
.box{
    background:var(--primary);
    color:white;
    padding:20px;
    border-radius:var(--radius);
    text-align:center;
}
button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    background:var(--success);
    color:white;
    border-radius:5px;
    cursor:pointer;
}
button:focus{outline:3px solid rgba(25,135,84,.25)}
footer{
    background:var(--primary);
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
/* toast */
#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#fff;
  color:var(--text);
  border-left:6px solid var(--primary);
  padding:12px 16px;
  border-radius:8px;
  box-shadow:0 6px 20px rgba(2,6,23,.12);
  display:none;
  min-width:200px;
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<header>
    <h1>SISFO SMK BATIK 1 SURAKARTA</h1>
    <p>Sistem Informasi Akademik SMK BATIK 1 SURAKARTA</p>
</header>

<nav aria-label="Navigasi utama">
    <a href="#">Beranda</a>
    <a href="#">Jadwal</a>
    <a href="#">Nilai</a>
    <a href="#">Presensi</a>
    <a href="#">PKL</a>
    <a href="#">Pengumuman</a>
</nav>

<main class="container" id="main" tabindex="-1">

<section class="dashboard card" aria-label="Statistik sekolah">
    <div class="box" role="region" aria-labelledby="siswa">
        <h2 id="siswa">1.250</h2>
        <p>Siswa</p>
    </div>

    <div class="box" role="region" aria-labelledby="guru">
        <h2 id="guru">85</h2>
        <p>Guru</p>
    </div>

    <div class="box" role="region" aria-labelledby="kelas">
        <h2 id="kelas">42</h2>
        <p>Kelas</p>
    </div>

    <div class="box" role="region" aria-labelledby="kehadiran">
        <h2 id="kehadiran">98%</h2>
        <p>Kehadiran Hari Ini</p>
    </div>
</section>

<section class="card" aria-live="polite" aria-atomic="true">
    <h2>Pengumuman</h2>
    <p>Selamat datang di Sistem Informasi Akademik SMK BATIK 1 SURAKARTA.</p>

    <button type="button" id="infoButton" aria-controls="toast" aria-expanded="false">Lihat Info</button>
</section>

</main>

<footer role="contentinfo">
&copy; 2026 SMK BATIK 1 SURAKARTA
</footer>

<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
// Accessible toast implementation (non-blocking). Replaces alert().
(function(){
  const toast = document.getElementById('toast');
  const btn = document.getElementById('infoButton');
  let hideTimer = null;

  function showToast(message, timeout = 4000){
    toast.textContent = message;
    toast.style.display = 'block';
    btn.setAttribute('aria-expanded', 'true');
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      toast.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
    }, timeout);
  }

  btn.addEventListener('click', function(){
    showToast('Selamat datang di SISFO SMK BATIK 1 SURAKARTA.');
    // Move focus back to the button after showing for screen reader context
    btn.focus();
  });

  // keyboard shortcut: press 'i' to open info (only when focus is not on an input)
  document.addEventListener('keydown', function(e){
    const active = document.activeElement;
    const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
    if(!isInput && (e.key === 'i' || e.key === 'I')){
      showToast('Selamat datang di SISFO SMK BATIK 1 SURAKARTA.');
    }
  });
})();
</script>

</body>
</html>
